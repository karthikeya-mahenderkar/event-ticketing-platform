# Test profile: in-memory H2 in PostgreSQL mode, so tests need no Docker, Postgres or Keycloak.
# NON_KEYWORDS=VALUE: the qr_codes.value column is a reserved word in H2 (not in PostgreSQL).
spring.datasource.url=jdbc:h2:mem:tickets;MODE=PostgreSQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=30
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# The JWT decoder is created lazily, so no Keycloak server is contacted during tests.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/test
